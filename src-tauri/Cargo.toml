[package]
name = "wane"
version = "0.1.0"
description = "Always-on-top macOS app that shows the time left until the next routine item"
authors = ["osatoh"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash with the bin target (https://github.com/rust-lang/cargo/issues/8519)
name = "wane_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Transparent window background on macOS (Spec §7)
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.8"
notify = "8"
tauri-plugin-window-state = "2"

# Native window tweaks where Tauri's options are not enough (Spec §2)
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3"
# Launch at Login (Spec §7)
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
