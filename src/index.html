<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wane</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <!-- Drag handle for the frameless window; only applies to clicks on the element itself,
         so its children ignore pointer events (see style.css) -->
    <main data-tauri-drag-region>
      <div id="gauge-wrap">
        <div id="gauge"></div>
        <div id="details">
          <span id="remaining"></span>
          <span id="next-time"></span>
        </div>
      </div>
      <div id="titles">
        <p id="current-title"></p>
        <p id="next-title"></p>
      </div>
      <p id="error" role="alert" hidden></p>
    </main>
  </body>
</html>
